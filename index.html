<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cửa hàng tiện lợi 24h – 7-Eleven</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dde7ea;--font:"Baloo 2","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;--ink:#3a2412;--or:#f58220;--gr:#00834f;--rd:#e31d2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1216}}
:root[data-theme="dark"]{--bg:#0b1216}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font:600 14px/1.25 var(--font);user-select:none;-webkit-user-select:none;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#wrap{position:absolute;inset:0;overflow:hidden}
#st{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:#0f2a33;overflow:hidden;border-radius:14px;box-shadow:0 14px 44px #000b;font-family:var(--font)}
.a{position:absolute}
svg.ui{width:1.2em;height:1.2em;flex:none;vertical-align:middle}

/* ===== NÚT BẤM BÓNG (kiểu game) ===== */
button{--t:#ffd27d;--m:#ff9a2e;--b:#ee6c00;--d:#7a3500;font:800 14px/1 var(--font);cursor:pointer;color:#fff;border:2px solid var(--d);border-radius:10px;padding:6px 10px;position:relative;overflow:hidden;
 background:linear-gradient(var(--t),var(--m) 48%,var(--b) 52%,var(--m));box-shadow:0 3px 0 var(--d),0 6px 8px #0005;text-shadow:0 1px 0 var(--d),0 0 3px var(--d);transition:transform .08s,filter .15s}
button:after{content:"";position:absolute;left:3px;right:3px;top:2px;height:42%;border-radius:8px 8px 16px 16px/8px 8px 10px 10px;background:linear-gradient(#fffa,#fff2);pointer-events:none}
button:hover{filter:brightness(1.09)}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--d),0 2px 4px #0005}
button:disabled{filter:grayscale(.85) brightness(.85);opacity:.65;cursor:default;box-shadow:0 3px 0 #444;transform:none}
button.g{--t:#93eea4;--m:#35b957;--b:#1e9a40;--d:#0b5a22}
button.b{--t:#9ad6ff;--m:#3a97ee;--b:#1f78d1;--d:#0d3f78}
button.rd{--t:#ffa79d;--m:#ea4335;--b:#c92a1d;--d:#6e100a}
button.p{--t:#e1b3ee;--m:#a24fc0;--b:#82309f;--d:#42125a}
button.d{--t:#7a95a2;--m:#476069;--b:#324750;--d:#101c22}
button.big{font-size:22px;padding:10px 26px;border-radius:14px}

/* ===== HUD ===== */
#hud{left:0;top:0;width:960px;height:40px;z-index:9;position:absolute;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 8px 3px;background:linear-gradient(#27a07c,#0f5a43 55%,#0a3a2b);box-shadow:0 4px 10px #0009,inset 0 2px 0 #ffffff66;color:#fff}
#hud:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#f58220 0 33.4%,#00a35a 33.4% 66.7%,#e31d2b 66.7%)}
.pill{display:flex;align-items:center;gap:5px;height:28px;padding:0 11px 0 5px;border-radius:15px;background:linear-gradient(#0a222c,#17404f);border:2px solid #061017;box-shadow:inset 0 3px 5px #000a,0 0 0 2px #ffffff2e;font:800 16px/1 var(--font);text-shadow:0 1px 2px #000b;white-space:nowrap;position:relative}
.pill .ui{width:22px;height:22px;filter:drop-shadow(0 1px 1px #0008)}
.pill small{font-size:12px;opacity:.85;margin-left:-3px}
.pill.gold{box-shadow:inset 0 3px 5px #000a,0 0 0 2px #ffc83d,0 0 9px #ffc83d77}
.pill.gold b{color:#ffe38a;min-width:26px;text-align:right}
.pill.clk{overflow:hidden;padding-bottom:3px}
.dpb{position:absolute;left:7px;right:7px;bottom:2px;height:3px;border-radius:2px;background:#0009;overflow:hidden}
.dpb s{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd54f,#ff7043)}
.stars{display:flex}
.stars .ui{width:15px;height:15px;margin-right:-1px;filter:drop-shadow(0 1px 0 #0008)}
.stars .off{color:#3d5560}.stars .on{color:#ffcc33}
#hud button{--t:#5fd2ae;--m:#26a077;--b:#177857;--d:#05352a;height:28px;padding:0 9px 0 6px;display:flex;align-items:center;gap:4px;font-size:13px;border-radius:9px}
#hud button .ui{width:18px;height:18px;filter:drop-shadow(0 1px 0 #0006)}
#hud>*{flex:none}
#hud button .vl{white-space:nowrap}
#hud button:not(.on) .vl{display:none}
#hud button:not(.on):not(.sq){padding:0 7px}
#hud button.on{--t:#ffd27d;--m:#ff9a2e;--b:#ee6c00;--d:#7a3500}
#hud button.sq{padding:0 7px}
#qb{display:flex;align-items:center;gap:3px;height:24px;padding:0 9px 0 6px;border-radius:12px;background:linear-gradient(#ff6a5f,#d32a1f);border:2px solid #6e100a;color:#fff;font:800 14px/1 var(--font);animation:ring 1s infinite;box-shadow:0 2px 4px #0006}
#qb:empty{display:none}
#qb .ui{width:15px;height:15px}

/* ===== TƯỜNG, CỬA SỔ, ĐỒNG HỒ, BẢNG MENU ===== */
#wall{left:0;top:40px;width:960px;height:166px;overflow:hidden;
 background:radial-gradient(ellipse 130px 46px at 150px 0,#fffe 0,#fff0 100%),radial-gradient(ellipse 130px 46px at 400px 0,#fffe 0,#fff0 100%),radial-gradient(ellipse 130px 46px at 650px 0,#fffe 0,#fff0 100%),radial-gradient(ellipse 130px 46px at 890px 0,#fffe 0,#fff0 100%),
 repeating-linear-gradient(90deg,#0000 0 59px,#0000001a 59px 60px),repeating-linear-gradient(0deg,#0000 0 39px,#00000014 39px 40px),linear-gradient(#eaf6f1,#cde5dd);box-shadow:inset 0 -18px 24px #0003}
.stripe{position:absolute;left:0;right:0;top:0;height:13px;background:linear-gradient(#f58220 0 33%,#00a35a 33% 66%,#e31d2b 66%);box-shadow:0 3px 6px #0005}
#win{position:absolute;left:28px;top:26px;width:204px;height:122px;box-sizing:border-box;border:7px solid #f7fbfc;border-radius:10px;box-shadow:0 0 0 2px #7e9aa5,0 8px 14px #0005,inset 0 0 14px #0007;overflow:hidden;background:linear-gradient(var(--s1,#5db7ff),var(--s2,#d8f1ff))}
#win .city{position:absolute;left:0;bottom:0;width:100%;height:100%}
#win .city .lw{opacity:var(--lit,0)}
#win .st2{position:absolute;inset:0;opacity:var(--lit,0);background:radial-gradient(1.5px 1.5px at 20px 14px,#fff,#0000),radial-gradient(1.5px 1.5px at 60px 30px,#fff,#0000),radial-gradient(1px 1px at 110px 12px,#fff,#0000),radial-gradient(1.5px 1.5px at 150px 24px,#fff,#0000),radial-gradient(1px 1px at 180px 10px,#fff,#0000),radial-gradient(1px 1px at 90px 40px,#fff,#0000)}
#orb{position:absolute;width:26px;height:26px;border-radius:50%;margin:-13px 0 0 -13px}
#orb.sun{background:radial-gradient(circle,#fff9c9 0,#ffd54f 55%,#ff9800);box-shadow:0 0 20px 8px #ffd54f88}
#orb.moon{background:radial-gradient(circle at 35% 35%,#fff,#dfe7f5 60%,#b5c3dc);box-shadow:0 0 16px 5px #cfe0ff66}
#win .mull{position:absolute;left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px;background:#f7fbfc;box-shadow:0 0 3px #0005}
#win .mull:after{content:"";position:absolute;left:-100px;right:-100px;top:50%;height:5px;margin-top:-2.5px;background:#f7fbfc;box-shadow:0 0 3px #0005}
#win .glare{position:absolute;inset:0;background:linear-gradient(115deg,#fff0 30%,#fff5 40%,#fff0 48%,#fff0 60%,#fff3 66%,#fff0 72%);pointer-events:none}
.wclock{position:absolute;left:254px;top:24px;width:56px;height:56px;box-sizing:border-box;border-radius:50%;border:5px solid #f58220;box-shadow:0 5px 9px #0006,inset 0 0 8px #0004,0 0 0 2px #7a3500;background:repeating-conic-gradient(#33414b 0 2deg,#0000 2deg 30deg),#fff}
.wclock i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:3px}
.wclock .hh{width:4px;height:13px;margin-left:-2px;background:#24313a}
.wclock .mm{width:3px;height:19px;margin-left:-1.5px;background:#e53935}
.wclock:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#24313a}
.board{position:absolute;left:722px;top:22px;width:212px;height:128px;box-sizing:border-box;border-radius:12px;padding:6px 10px;color:#fff;background:linear-gradient(#2a3a43,#10191e);border:5px solid #f58220;box-shadow:0 0 0 3px #7a3500,0 0 20px #f5822099,0 9px 14px #0007,inset 0 0 20px #000b}
.board h4{margin:0 0 3px;font:800 15px/1 var(--font);color:#ffe27a;text-align:center;text-shadow:0 0 8px #ffb300}
.board .bi{display:flex;align-items:center;gap:6px;height:30px;border-top:1px dashed #ffffff30}
.board .bi svg.ic{width:26px;height:26px}
.board .bi span{flex:1;font-size:13px}
.board .bi b{background:#e31d2b;border-radius:10px;padding:1px 8px;font-size:13px;box-shadow:inset 0 -2px 0 #0004}
.burst{position:absolute;right:-16px;top:-18px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#ff5a4d,#c4170a);border:3px solid #fff;color:#fff;font:800 17px/50px var(--font);text-align:center;transform:rotate(14deg) scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1);box-shadow:0 4px 8px #0008}
#st.promo .burst{transform:rotate(14deg) scale(1);animation:pulse 1s infinite alternate}

/* ===== KHÁCH HÀNG & PHIẾU ĐƠN ===== */
#cu{left:0;top:40px;width:960px;height:166px;pointer-events:none;overflow:hidden}
#qv,#cx,#cs{position:absolute;left:0;top:0;width:960px;height:166px}
.qsp{position:absolute;bottom:-6px;width:106px;transform-origin:50% 100%;filter:brightness(.8) saturate(.8)}
#cs .cust,#cx .cust{position:absolute;left:394px;bottom:-6px;width:124px;transform-origin:50% 100%}
.cust svg{display:block;width:100%;overflow:visible}
.cust{animation:breathe 3.2s ease-in-out infinite}
.cust.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.1),breathe 3.2s .55s ease-in-out infinite}
.cust.m2{animation:angry .38s infinite}
.cust.leave.ok{animation:leaveOk .7s ease-in forwards}
.cust.leave.bad{animation:leaveBad .55s ease-in forwards}
.cust:not(.m0) .v0,.cust:not(.m1) .v1,.cust:not(.m2) .v2{display:none}
#qbadge{position:absolute;left:300px;top:6px;height:22px;padding:0 9px 0 6px;border-radius:12px;background:#0b2530dd;border:2px solid #ffffff55;color:#fff;font:800 13px/18px var(--font);display:flex;align-items:center;gap:4px}
#tk{position:absolute;left:548px;top:12px;width:168px;box-sizing:border-box;background:#fffdf3;border-radius:11px 11px 4px 4px;box-shadow:0 9px 14px #0007,0 0 0 3px #ffffffb0;color:var(--ink);transform:rotate(1.6deg);transform-origin:50% 0;pointer-events:none}
#tk.pop{animation:tkin .45s cubic-bezier(.3,1.6,.5,1)}
#tk:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;background:linear-gradient(135deg,#fffdf3 50%,#0000 50%) 0 0/10px 8px,linear-gradient(225deg,#fffdf3 50%,#0000 50%) 0 0/10px 8px}
#tk:before{content:"";position:absolute;left:50%;top:-8px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a80,#c62828);box-shadow:0 2px 3px #0006}
.tkh{display:flex;align-items:center;gap:5px;padding:6px 8px 4px;border-radius:11px 11px 0 0;background:repeating-linear-gradient(135deg,#f58220 0 8px,#ff9a3c 8px 16px);color:#fff;font:800 13px/1 var(--font);text-shadow:0 1px 0 #7a3500}
.tkb{display:flex;flex-wrap:wrap;gap:5px;padding:7px 7px 3px;justify-content:center;min-height:42px;align-content:flex-start}
.ti{position:relative;width:34px;height:34px;border-radius:9px;background:#f1ead7;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 #0001}
.ti svg.ic{width:26px;height:26px;filter:none}
.ti.bagged{background:#d6f5dc}.ti.bagged svg.ic{opacity:.5}
.tg2{position:absolute;right:-4px;top:-5px;width:15px;height:15px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px #0005}
.tg2 .ui{width:9px;height:9px;color:#fff}
.tg2.scan{background:#546e7a}.tg2.heat{background:#ff7043}.tg2.cup{background:#29b6f6}.tg2.rdy{background:#2fb552}
.tkf{display:flex;align-items:center;gap:6px;padding:3px 8px 9px}
.tkf .pay{display:flex;align-items:center;gap:3px;font:800 12px/1 var(--font);color:#1b5e20;background:#c8f7d2;border-radius:8px;padding:3px 6px;animation:pulse .7s infinite alternate}
.tkf .pay .ui{width:18px;height:18px}
.pbar{display:block;flex:1;height:9px;border-radius:5px;background:#0003;overflow:hidden;box-shadow:inset 0 2px 2px #0004}
.pbar b{display:block;height:100%;width:100%;background:#43a047;border-radius:5px;box-shadow:inset 0 3px 0 #fff5}
#tk.idle{width:150px;text-align:center;padding:8px 8px 12px;font:700 13px/1.25 var(--font)}
#tk.idle>.ui{width:30px;height:30px;display:block;margin:0 auto 2px}
#tk.idle button{pointer-events:auto;margin-top:5px;font-size:12px;padding:5px 9px}

/* ===== MẶT QUẦY, TỦ DƯỚI ===== */
#ctr{left:0;top:205px;width:960px;height:210px;border-top:7px solid #6a7b86;box-sizing:border-box;
 background:linear-gradient(#fff8 0,#fff0 8px),repeating-linear-gradient(90deg,#0000 0 3px,#0000000b 3px 4px),linear-gradient(#eef3f6,#c9d4da 30%,#a6b4be 72%,#8d9da8);box-shadow:inset 0 12px 16px #fffa,0 -6px 14px #0004}
#ctr:after{content:"";position:absolute;left:0;right:0;bottom:0;height:11px;background:linear-gradient(#d9a566,#a8692e 60%,#7a4a20);box-shadow:0 -2px 4px #0005}
#cab{left:0;top:415px;width:960px;height:125px;background:repeating-linear-gradient(90deg,#0000 0 238px,#000a 238px 240px,#ffffff14 240px 241px),linear-gradient(#41515b,#1d272e);box-shadow:inset 0 12px 18px #000b}
#cab:after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#f58220 0 33.4%,#00a35a 33.4% 66.7%,#e31d2b 66.7%)}

/* ===== THIẾT BỊ ===== */
.zn{box-sizing:border-box;border-radius:14px;color:#fff;overflow:hidden}
.ap{display:flex;flex-direction:column;gap:4px;padding:6px}
.ap-h{font:800 11px/1 var(--font);text-align:center;letter-spacing:.2px;text-shadow:0 1px 0 #0006}
.ap-w{flex:1;border-radius:9px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;background:linear-gradient(145deg,#1c2f38,#071015);border:3px solid #0a1318;box-shadow:inset 0 0 12px #000,inset 0 2px 0 #ffffff22;position:relative;overflow:visible}
.ap-w:after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(120deg,#fff0 35%,#ffffff22 45%,#fff0 55%);pointer-events:none}
.ap.busy .ap-w{animation:glow 1s infinite alternate}
#mic.busy .ap-w{background:radial-gradient(circle,#ffe08a 0,#ff9a3a 45%,#6e3210 100%)}
#ovn.busy .ap-w{background:repeating-linear-gradient(180deg,#1a0a06 0 9px,#ff4b1f 9px 12px,#1a0a06 12px 14px),#1a0a06}
.ap-c{display:flex;align-items:center;gap:4px;justify-content:space-between}
.ap-c s{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aab7bf 55%,#58666f);border:2px solid #2c3a42;box-shadow:0 2px 3px #0006}
.led{font:800 15px/1 var(--font);font-variant-numeric:tabular-nums;color:#ff4a3a;background:#1a0505;border:2px solid #000;border-radius:5px;padding:2px 5px;text-shadow:0 0 6px #ff2a1a;letter-spacing:.5px;box-shadow:inset 0 0 6px #000}
.led.off{color:#6a2018;text-shadow:none}
#mic{left:14px;top:228px;width:104px;height:128px;background:linear-gradient(160deg,#f7fafb,#cfd9df 52%,#9fb0ba);border:3px solid #52646f;box-shadow:inset 0 2px 0 #fff,inset 0 -7px 12px #0003,0 10px 14px #0007}
#mic .ap-h{color:#2c3d47;text-shadow:none}
#ovn{left:126px;top:228px;width:104px;height:128px;background:linear-gradient(160deg,#5a4a44,#2f2521 60%,#1b1411);border:3px solid #120d0a;box-shadow:inset 0 2px 0 #ffffff44,inset 0 -7px 12px #0006,0 10px 14px #0007}
#ovn .ap-c{border-top:3px solid #b9c4cb;padding-top:3px}

#scn{left:575px;top:366px;width:195px;height:44px;border-radius:11px;overflow:visible;background:linear-gradient(#37444e,#0c1115);border:3px solid #1a2228;box-shadow:inset 0 3px 6px #000,0 6px 10px #0006;display:flex;align-items:center;justify-content:center;gap:4px;position:absolute}
#scn:before{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:linear-gradient(90deg,#f330,#ff3b30,#f330);box-shadow:0 0 10px 2px #ff3b30aa;animation:laser 1.6s ease-in-out infinite alternate}
#scn.busy:before{height:5px;box-shadow:0 0 18px 5px #ff3b30;animation:laserFast .25s linear infinite alternate}
#scn .lab{position:absolute;right:9px;bottom:2px;font:800 9px/1 var(--font);color:#8aa0ac;letter-spacing:1px}
#scn:after{content:"";position:absolute;left:6px;top:5px;width:7px;height:7px;border-radius:50%;background:#32d96b;box-shadow:0 0 8px #32d96b}
#scn .it{z-index:1;width:34px;height:34px}
#scn .it svg.ic{width:26px;height:26px}
#scn .it u{bottom:-9px}

#mac{left:780px;top:218px;width:170px;height:140px;background:linear-gradient(160deg,#79a6b5,#2f5767 55%,#1b333d);border:3px solid #0f2128;box-shadow:inset 0 3px 0 #ffffff55,inset 0 -8px 14px #0006,0 10px 14px #0007;display:flex;flex-direction:column;padding:0}
.mc-t{height:30px;display:flex;align-items:center;gap:6px;padding:0 9px;background:linear-gradient(#e53935,#a8140f);border-bottom:3px solid #4d0a07;font:800 12px/1 var(--font);text-shadow:0 1px 0 #4d0a07}
.mc-t b{flex:1}
.lt{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px currentColor}
.lt.a{background:#ff8f00;color:#ff8f00}.lt.b{background:#7cd9ff;color:#7cd9ff}
.mc-r{flex:1;margin:7px 11px 0;border-radius:9px 9px 3px 3px;background:linear-gradient(#10222a,#050c10);border:3px solid #0a1318;box-shadow:inset 0 0 14px #000;display:flex;align-items:flex-end;justify-content:center;position:relative;padding-bottom:3px;overflow:visible}
.nz{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;gap:34px}
.nz s{display:block;width:12px;height:14px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,#9fb0ba,#eef3f6,#7b8d98);box-shadow:0 2px 3px #0008;position:relative}
.nz s:after{content:"";position:absolute;left:4.5px;top:14px;width:3px;height:0;background:linear-gradient(#5d4037,#3e2723);border-radius:2px;transition:height .15s}
.mc-r.on .nz s:after{height:52px;animation:pour .4s linear infinite}
.mc-g{height:12px;margin:0 9px 6px;border-radius:3px;background:repeating-linear-gradient(90deg,#27333a 0 5px,#5c6c76 5px 8px);box-shadow:0 3px 4px #0006}

#cup{left:780px;top:366px;width:170px;height:44px;display:flex;align-items:center;gap:7px;color:#27424d;font:800 12px/1.1 var(--font);padding-left:8px;box-sizing:border-box;border-radius:12px;background:linear-gradient(#ffffff55,#ffffff11);box-shadow:inset 0 0 0 2px #ffffff55}
#cup .it{box-shadow:0 4px 0 #0003,0 6px 8px #0005,2px -3px 0 -1px #fff,4px -6px 0 -2px #dfe9ee}

#pos{left:575px;top:218px;width:195px;height:140px;box-sizing:border-box;padding:6px;border-radius:14px;background:linear-gradient(#3d5766,#16262f);border:4px solid #2a3b45;box-shadow:inset 0 2px 0 #ffffff44,0 10px 14px #0007;color:#bff;display:flex;flex-direction:column;gap:4px}
#pos:before{content:"";position:absolute;left:30px;right:30px;top:-12px;height:14px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#e8e8e8,#fff,#dcdcdc);box-shadow:0 -2px 4px #0003}
.scr{flex:1;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;overflow:hidden;padding:4px;border-radius:7px;background:linear-gradient(#0f4a40,#06241f);border:2px solid #02110e;box-shadow:inset 0 0 12px #000a,0 0 0 2px #ffffff22;font-size:12px;position:relative}

/* ===== HOẠT ẢNH ===== */
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(-5deg)}40%{transform:rotate(0)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
@keyframes enter{from{transform:translateX(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes leaveOk{0%{transform:none;opacity:1}25%{transform:translateY(-16px)}100%{transform:translateX(130px);opacity:0}}
@keyframes leaveBad{0%{transform:none;opacity:1}15%{transform:translateX(-7px)}30%{transform:translateX(7px)}100%{transform:translateX(-150px);opacity:0}}
@keyframes angry{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-.8deg)}75%{transform:translateX(2px) rotate(.8deg)}}
@keyframes tkin{from{transform:rotate(1.6deg) translateY(-30px) scale(.7);opacity:0}to{transform:rotate(1.6deg);opacity:1}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.3)}}
@keyframes laser{from{transform:translateY(-9px)}to{transform:translateY(9px)}}
@keyframes laserFast{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
@keyframes pour{0%{opacity:.7}50%{opacity:1}100%{opacity:.7}}
@keyframes hot{from{box-shadow:0 0 0 3px #ff9a2e,0 0 8px 2px #ff9a2e88}to{box-shadow:0 0 0 3px #ffd27d,0 0 18px 7px #ff9a2ecc}}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px) scale(1.5);opacity:0}}
@keyframes tgt{from{filter:brightness(1)}to{filter:brightness(1.3) drop-shadow(0 0 7px #ffe14a)}}
@keyframes alarm{from{box-shadow:0 0 0 0 #ff3b30}to{box-shadow:0 0 14px 2px #ff3b30}}
@keyframes chip{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floatup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-70%) scale(1.15);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
@keyframes coinfly{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.9);opacity:.2}}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes starpop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes confetti{to{transform:translateY(580px) rotate(720deg);opacity:.9}}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
.shk{animation:shk .35s}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* sơ đồ vị trí biểu tượng hàng trên nhãn thùng: <use> xếp thêm khi vẽ thùng */
function boxSVG(id,x,y,w,rot){ // vẽ 1 thùng w px rộng, có nhãn sản phẩm
  const h=w*.75,s=w/64;
  return `<g transform="translate(${x} ${y}) rotate(${rot||0} ${w/2} ${h})"><use href="#bx" width="${w}" height="${h}"/><use href="#p${id}" x="${4*s}" y="${15*s}" width="${20*s}" height="${26*s}" preserveAspectRatio="xMidYMid meet" /></g>`;
}

/* hình mẫu khách hàng theo loại; mỗi khách có "look" riêng cố định */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function mkLook(ti){
  const skin=rnd(SKINS),fem=Math.random()<.5;
  if(ti===1) return {skin,hair:rnd(['#1b1b1f','#2a1c14']),hs:fem?'bob':'spiky',shirt:'#f5f7f9',tie:rnd(['#d92b2b','#2b66d9']),top:'shirt',pants:'#2b3442'};
  if(ti===2) return {skin,hair:rnd(['#b9bac2','#d8d8de']),hs:fem?'bun':'elder',shirt:'#8a5cd6',top:'cardigan',glasses:true,pants:'#4a4256'};
  if(ti===3) return {skin,hair:rnd(['#8a4b1d','#b5651d']),hs:fem?'pony':'short',shirt:'#f0b429',top:'hoodie',cap:Math.random()<.5?'#e8651a':null,capBand:'#fff',pants:'#3b4a63'};
  return {skin,hair:rnd(['#3b2a1d','#1b1b1f','#5a3a22']),hs:fem?rnd(['long','pony','bob']):'short',shirt:rnd(['#1fa39a','#3b82c4','#e86a8a','#6bbf59']),top:'tee',pants:rnd(['#33475b','#4a4a58','#5a4636'])};
}
/* nhân viên: k='s' (kệ, áo polo xanh) · 'o' (kho, áo gile cam) */
const STAFF_LOOK={
  s:[{hair:'#1b1b1f',hs:'pony',skin:SKINS[1]},{hair:'#4a3020',hs:'short',skin:SKINS[0]},{hair:'#2a1c14',hs:'long',skin:SKINS[2]}],
  o:[{hair:'#2a1c14',hs:'short',skin:SKINS[2]},{hair:'#5a3a22',hs:'pony',skin:SKINS[0]},{hair:'#1b1b1f',hs:'short',skin:SKINS[1]}]
};
function staffSVG(k,i,o2={}){
  const b=STAFF_LOOK[k][i%3];
  return person(Object.assign(k==='s'
    ?{shirt:'#00833e',top:'polo',polo:true,cap:'#00833e',capBand:'#f58220',pants:'#2b3442'}
    :{shirt:'#f4f6f8',top:'tee',vest:'#f58220',cap:'#2b3b57',capBand:'#f58220',pants:'#47546a'},b,o2));
}

function laneBG(){
  const shelf=(x,w)=>{let s=`<rect x="${x}" y="30" width="${w}" height="100" rx="3" fill="#dbe4e9" stroke="#b6c3cb" stroke-width="1.2"/>`;
    const cols=['#ee2e24','#f58220','#00a14b','#2b86d9','#ffc21f','#e86a8a'];
    for(let r=0;r<4;r++){const y=36+r*24;s+=`<rect x="${x+2}" y="${y+16}" width="${w-4}" height="3" fill="#9fb0ba"/>`;
      for(let k=0;k<Math.floor((w-8)/9);k++)s+=`<rect x="${x+5+k*9}" y="${y+4+(k%3)*2}" width="7" height="${12-(k%3)*2}" rx="1.4" fill="${cols[(r*3+k)%6]}" opacity=".9"/>`;}

 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v||.1,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03)}catch(e){}}

const trOf=sd=>[0,0,1,2,3][sd%5];
function newCust(sd){
 const seed=sd==null?ri(999):sd,tr=trOf(seed), c={id:++uid,tr,items:[],bag:-1,pay:ri(3),exp:0,disc:0,seed};
 c.max=c.pat=PATIENCE[tr]*(1+.1*S.u.area);
 let n=1+ri(5)+(ri(3)==0?ri(3):0),miss=0;
 for(let k=0;k<n;k++){const i=ri(NP);if(cnt(S.pr[i].s)>0){if(takeShelf(i))c.exp=1;c.items.push(mk(i))}else miss++}
 if(ri(100)<30)c.items.push(mk(NP+ri(2)));
 if(ri(100)<8)c.items.push(mk(NP+ri(2)));
 if(miss){S.r=cl(S.r-.5*miss);S.st.lost+=miss}
 if(!c.items.length){S.r=cl(S.r-2);bad(t('Hết hàng – khách bỏ đi!','Out of stock – customer left!'));return null}
 return c}

function drop(k,z){
 const c=S.cur;if(!c)return;if(S.off)return bad(t('Đang mất điện!','Power is out!'));
 if(k=='cup'){const it=c.items.find(x=>x.loc=='need');
  if(z!='mac'||!it||c.items.some(x=>x.loc=='mac'&&!x.done))return bad(t('Chưa cần ly / máy đang bận','No cup needed / busy'));
  it.loc='mac';it.t0=S.now;it.dur=3.5*Math.pow(.75,S.u.soda);sfx('pop');return}
 const it=c.items.find(x=>x.u==k);if(!it)return;
 if(z=='scan'&&it.loc=='tray'&&!it.sc){it.loc='scn';it.t0=S.now;it.dur=.9*Math.pow(.7,S.u.scan);sfx('pop')}
 else if((z=='mic'||z=='ovn')&&it.loc=='tray'&&it.sc&&it.h==z){
  if(its(c,x=>x.loc==z).length>=2)return bad(t('Lò đã đầy','Appliance full'));
  it.loc=z;it.t0=S.now;it.dur=(z=='mic'?5:7)*Math.pow(.75,S.u.heat);sfx('pop')}
 else if(z=='bag'&&it.loc!='bag'&&it.sc&&(!it.h||it.done)&&!it.t0){
  if(c.bag<0)return bad(t('Hãy chọn túi trước!','Pick a bag first!'));
  if(its(c,x=>x.loc=='bag').length>=[3,5,10][c.bag])return bad(t('Túi đầy! Chọn túi lớn hơn','Bag full! Pick a bigger one'));
  it.loc='bag';sfx('pop');sparks(ANC.bag,5)}
 else bad(it.h&&it.h!='mac'&&!it.sc?t('Cần quét trước!','Scan first!'):!it.sc?t('Cần quét trước!','Scan first!'):t('Sai thao tác / sai lò!','Wrong action / wrong oven!'))}
function pay(m){
 const c=S.cur;if(!c||S.off)return;if(!rdy(c))return bad(t('Chưa xong hàng!','Order not ready!'));
 if(c.cs)return;
 if(c.disc==1){c.disc=3;c.pat-=c.max*.15}
 if(m!=c.pay){S.r=cl(S.r-(c.tr==2?2:1));shake('pos');return bad(t('Sai phương thức thanh toán!','Wrong payment method!'))}
 if(m==0)return startCash(c);   // tiền mặt: mở két, nhân viên tự thối tiền
 finishPay(c)}
function finishPay(c,cs,diff){
 let tot=cs?cs.tot:c.items.reduce((a,x)=>a+price(x.i),0);const cost=c.items.reduce((a,x)=>a+P[x.i][3],0);
 if(!cs&&c.disc==2)tot=Math.round(tot*.9);
 const tip=diff<0?0:Math.round(tot*.1*Math.max(0,c.pat/c.max));
 const happy=c.pat>c.max*.5;
 if(c.exp){tot=Math.round(tot/2);S.r=cl(S.r-(c.tr==2?4:2));bad(t('Khách phát hiện hàng hết hạn! Hoàn 50%','Expired item found! 50% refund'));outcome='bad';emote('😠')}
 else{toast('+'+(tot+tip)+'k');outcome='ok';sfx('cash');emote(happy?'😍':'🙂')}
 const g=tot+tip;fxText(ANC.pos[0],ANC.pos[1]-14,'+'+g+'k',c.exp);coins(ANC.pos,Math.min(8,2+Math.round(g/12)));
 S.m+=g;S.st.rev+=g;S.st.cogs+=cost;S.st.n++;S.r=cl(S.r+1+(c.pat>c.max*.5?1:0));
 if(diff<0){S.r=cl(S.r-(c.tr==2?3:2));outcome='bad';emote('😠');bad(t('😠 Khách: "Thối thiếu tiền rồi!"','😠 "You gave me too little change!"'))}
 S.cur=null;S.gap=0;save()}

function fire(k){
 if(k=='pw'){S.off=1;S.taps=0;S.offT=45;sfx('alarm');toast(t('⚡ MẤT ĐIỆN!','⚡ POWER OUT!'),'bad')}
 else if(k=='fr'){S.fr={g:1+ri(2),t:70,fix:0};sfx('alarm');toast(t('❄️ Tủ lạnh '+S.fr.g+' bị hỏng!','❄️ Fridge '+S.fr.g+' broke!'),'bad')}
 else if(k=='th'){const l=S.pr.map((p,i)=>i).filter(i=>i<NP&&cnt(S.pr[i].s)>0);if(!l.length)return;
  const i=pick(l),q=Math.min(cnt(S.pr[i].s),1+ri(3));for(let j=0;j<q;j++)takeShelf(i);
  const v=q*P[i][3];S.th+=v;S.st.loss+=v;sfx('err');toast(t('🕵️ Mất trộm '+q+' '+nm(i)+'! Hãy làm báo cáo','🕵️ '+q+' '+nm(i)+' stolen! File a report'),'bad')}
 else if(k=='pr'){S.promo=120;sfx('up');toast(t('🏷️ Khuyến mãi 2 phút: giảm 20%, khách đông!','🏷️ Promo 2 min: -20%, more customers!'),'good')}}

function tick(){
 const n=Date.now(),dt=Math.min((n-last)/1000,.5);last=n;
 if(!S||mode!='play')return;
 S.now+=dt;S.t+=dt;S.sv+=dt;if(S.sv>5){S.sv=0;save()}
 while(S.ev.length&&S.ev[0].t<=S.t)fire(S.ev.shift().k);
 if(S.promo>0)S.promo-=dt;
 if(S.off){S.offT-=dt;if(S.offT<=0)S.off=0}
 const h=START_H+S.t/DAY*(END_H-START_H);
 S.nx-=dt;
 if(S.nx<=0){S.nx=SPAWN_BASE/(demand(h)*(S.hol?1.7:1)*(S.promo>0?1.4:1)*(.6+S.r/100))*(.7+rnd(.6));
  if(S.q<3+S.u.area){S.q++;S.qs.push(ri(999))}else S.r=cl(S.r-.5)}
 if(!S.cur&&S.q>0){S.gap+=dt;if(S.gap>.8){S.gap=0;S.q--;S.cur=newCust(S.qs.shift())}}
 const c=S.cur;
 if(c){if(!(c.cs&&S.view==0&&!S.off))c.pat-=dt;
  for(const it of c.items)if(it.t0&&S.now-it.t0>=it.dur){const z=it.loc;it.t0=0;
   if(z=='scn'){it.loc='tray';it.sc=1;sfx('beep');sparks(ANC.scan,6)}
   else{it.done=1;it.sc=1;sfx('ding');sparks(ANC[z]||ANC.pos,9)}}
  if(c.tr==3&&!c.disc&&c.items.some(x=>x.sc)){c.disc=1;toast(t('🤑 Khách: "Giảm giá đi!"','🤑 "Give me a discount!"'))}
  if(c.pat<=0){S.r=cl(S.r-3);S.st.lost+=c.items.length;outcome='bad';emote('😡');sfx('err');S.cur=null;toast(t('😡 Khách chờ quá lâu và bỏ đi!','😡 Customer left angry!'),'bad')}}
 if(S.fr){const f=S.fr;
  if(f.fix){f.fix-=dt;if(f.fix<=0){S.fr=null;toast(t('✅ Tủ lạnh đã sửa xong','✅ Fridge repaired'),'good')}}
  else{f.t-=dt;if(f.t<=0){let v=0;for(let i=0;i<NP;i++)if(P[i][6]==f.g){v+=cnt(S.pr[i].s)*P[i][3];S.pr[i].s=[]}
   S.m-=120;S.st.rp+=120;S.st.loss+=v;S.fr=null;sfx('err');toast(t('❄️ Hàng trong tủ hỏng hết! Sửa gấp −120k','❄️ Fridge stock spoiled! Emergency repair −120k'),'bad')}}}
 if(S.t>=DAY)endDay();
 R();ui()}

/* ================= KHO → XE ĐẨY → KỆ HÀNG ================= */
const CART=24, cartMax=()=>CART+8*S.u.area;
const cartN=()=>S.cart.reduce((a,x)=>a+x.q,0), cartI=i=>S.cart.filter(x=>x.i==i).reduce((a,x)=>a+x.q,0);
// Lấy hàng từ kho lên xe đẩy (vừa đủ lấp đầy kệ, hàng cũ lấy trước)
function take(i){
 const d=S.pr[i];let q=Math.min(cap(i)-cnt(d.s)-cartI(i),cartMax()-cartN(),cnt(d.w));
 if(q<=0)return bad(cnt(d.w)?t('Kệ đã đủ hàng / xe đẩy đầy','Shelf full / cart full'):t('Kho hết món này – hãy đặt hàng','Out of stock – order more'));
 sfx('fill');
 while(q>0&&d.w.length){const b=d.w[0],n=Math.min(q,b.q),x=S.cart.find(y=>y.i==i&&y.e==b.e);x?x.q+=n:S.cart.push({i,q:n,e:b.e});b.q-=n;q-=n;if(!b.q)d.w.shift()}}
// Xếp hàng từ xe đẩy lên đúng kệ
function put(i){
 const d=S.pr[i];let room=cap(i)-cnt(d.s);if(room<=0)return bad(t('Kệ đã đầy','Shelf is full'));
 sfx('pop');
 for(const x of S.cart.filter(y=>y.i==i).sort((a,b)=>a.e-b.e)){const n=Math.min(room,x.q);addB(d.s,n,x.e);x.q-=n;room-=n}
 S.cart=S.cart.filter(x=>x.q>0)}
// Điều phối thả: W:i = thùng kho, K:i = hàng trên xe, còn lại = thao tác ở quầy
function hand(k,z){
 if(k[0]=='W'){if(z=='cart')take(+k.slice(2))}
 else if(k[0]=='K'){const i=+k.slice(2);if(z.slice(0,3)=='sh:')+z.slice(3)==i?put(i):bad(t('Sai kệ! Món này thuộc kệ khác','Wrong shelf!'))}
 else if(!S.view)drop(k,z)}
/* ================= KHO → XE ĐẨY → KỆ HÀNG (hình ảnh kiểu game 7-Eleven) ================= */
const vis=(n,c,m)=>n<=0?0:Math.max(1,Math.min(m,Math.ceil(n/c*m)));
function shelfPile(i,k,cols,W,H){ // các món xếp 2 hàng: hàng trước, hàng sau so le
 if(k<=0)return'';
 const pitch=W/cols,sz=Math.min(pitch*1.1,H*.76),base=H-3,dy=sz*.27,front=Math.min(k,cols),back=Math.max(0,k-cols);
 const item=(cx,b,s)=>`<ellipse cx="${cx.toFixed(1)}" cy="${b-1}" rx="${(s*.34).toFixed(1)}" ry="${(s*.07).toFixed(1)}" fill="#000" opacity=".16"/><use href="#p${i}" x="${(cx-s/2).toFixed(1)}" y="${(b-s).toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}"/>`;
 let o='';
 for(let j=0;j<back;j++)o+=item(W/2+(j-(back-1)/2)*pitch,base-dy,sz*.94);
 for(let j=0;j<front;j++)o+=item(W/2+(j-(front-1)/2)*pitch,base,sz);
 return `<svg viewBox="0 0 ${W} ${H}">${o}</svg>`}
function boxPile(i,k,W,H){ // thùng carton xếp chồng 1 cột (1–3 thùng theo lượng hàng)

 for(let L=0;L<k;L++)o+=G1.boxSVG(i,W/2-bw/2,H-3-(L+1)*bh*.97,bw,((L*5+i)%5-2)*.8);
 return `<svg viewBox="0 0 ${W} ${H}">${o}</svg>`}

const gauge=(n,c,pt)=>`<span class="gauge">${pt}<b>${n}/${c}</b><span class="gt"><i style="width:${Math.min(100,n/c*100)}%"></i></span></span>`;
const cartH=a=>S.cart.map(x=>`<b class='it' ${a?`data-k='K:${x.i}' data-a='put' data-v='${x.i}'`:''}>${P[x.i][0]}<small>×${x.q}</small></b>`).join('');

const NCOL={1:'#b98a6e',2:'#7fb29a',5:'#8f7bd6',10:'#d9b34f',20:'#4f9fe0',50:'#ee86a8',100:'#6bbf7d',200:'#d98a62',500:'#3fb6c6'};
const noteArt=(v,cls)=>{const c=NCOL[v],d=G1.dark,l=G1.lite;
 return `<svg class="${cls||'note'}" viewBox="0 0 100 50"><rect x=".8" y=".8" width="98.4" height="48.4" rx="5" fill="${c}" stroke="${d(c,.35)}" stroke-width="1.4"/><rect x=".8" y=".8" width="98.4" height="48.4" rx="5" fill="${l(c,.3)}" opacity=".5"/>
 <rect x="4.5" y="4.5" width="91" height="41" rx="3" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" stroke-dasharray="2.4 1.8"/>
 <ellipse cx="50" cy="25" rx="10.5" ry="15" fill="${l(c,.6)}" stroke="#fff" stroke-width="1.2"/><circle cx="50" cy="20.5" r="4.8" fill="${d(c,.25)}" opacity=".65"/><path d="M40.5 37Q50 26 59.5 37Z" fill="${d(c,.25)}" opacity=".65"/>
 <path d="M8 41Q16 36 24 41T40 41" stroke="#fff" stroke-opacity=".6" fill="none" stroke-width="1.2"/><path d="M60 9Q68 14 76 9T92 9" stroke="#fff" stroke-opacity=".6" fill="none" stroke-width="1.2"/>
 <text x="8.5" y="19" font-size="14" ${G1.FONT} fill="#fff" stroke="${d(c,.5)}" stroke-width="2.6" paint-order="stroke">${v}k</text><text x="91.5" y="43.5" text-anchor="end" font-size="14" ${G1.FONT} fill="#fff" stroke="${d(c,.5)}" stroke-width="2.6" paint-order="stroke">${v}k</text></svg>`};
function canMake(amt,cash){ // két có đủ tờ để thối đúng amt không
 if(amt<=0)return true;
 const d=[...DEN].reverse(),memo=new Map();
 const go=(i,r)=>{if(!r)return true;if(i>=d.length)return false;const key=i*1000+r;if(memo.has(key))return memo.get(key);
  const v=d[i],m=Math.min(cash[v]||0,Math.floor(r/v));let ok=false;for(let k=m;k>=0&&!ok;k--)ok=go(i+1,r-k*v);memo.set(key,ok);return ok};
 return go(0,amt)}
const exactNotes=v=>{const o=[];for(const d of [...DEN].reverse())while(v>=d){o.push(d);v-=d}return o};
function pickPaid(due){ // khách đưa những tờ nào (luôn thối được từ két hiện có)
 const sum=l=>l.reduce((a,v)=>a+v,0),c=[],SM=[5,10,20,50,100];
 for(const v of [5,10,20,50,100,200,500])if(v>=due)c.push([v]);
 for(let a=0;a<SM.length;a++)for(let b=a;b<SM.length;b++){const x=SM[a],y=SM[b],s=x+y;if(s>=due&&s-x<due&&s-y<due)c.push([y,x])}
 const ok=c.filter(l=>canMake(sum(l)-due,S.cash)).sort((a,b)=>sum(a)-sum(b));
 if(!ok.length||ri(100)<18)return exactNotes(due);
 return ok[Math.floor(Math.pow(Math.random(),3)*Math.min(ok.length,5))]}
function startCash(c){
 let tot=c.items.reduce((a,x)=>a+price(x.i),0);if(c.disc==2)tot=Math.round(tot*.9);
 const due=c.exp?Math.round(tot/2):tot;
 c.cs={tot,due,paid:pickPaid(due),tray:{}};sfx('pop')}
function cashOk(){
 const c=S.cur,cs=c&&c.cs;if(!cs||S.off)return;
 const paidT=cs.paid.reduce((a,v)=>a+v,0),owed=paidT-cs.due,given=DEN.reduce((a,v)=>a+v*(cs.tray[v]||0),0),diff=given-owed;
 cs.paid.forEach(v=>S.cash[v]=(S.cash[v]||0)+1);DEN.forEach(v=>{S.cash[v]-=cs.tray[v]||0});
 S.st.cashIn+=cs.due;S.st.cN++;
 if(diff>0){S.st.cOver+=diff;S.st.chg+=diff}else if(diff<0){S.st.cUnder-=diff;S.st.chg-=diff}
 finishPay(c,cs,diff);
 if(diff==0)fxText(122,440,t('Thối đúng ✔','Exact ✔'))}
function cashHTML(){
 const c=S.cur,cs=c&&c.cs,tray=cs?cs.tray:{},trT=DEN.reduce((a,v)=>a+v*(tray[v]||0),0);
 const head=cs?`<span class="cpb">${t('Hóa đơn','Bill')} <em>${cs.due}k</em></span>${c.exp?`<span class="cpb x">${t('Hàng hết hạn: giảm 50%','Expired item: −50%')}</span>`:''}<span class="cpb">${t('Khách đưa','Paid')} <em>${cs.paid.reduce((a,v)=>a+v,0)}k</em></span>`
  :`<span class="cpb">${t('Tổng tiền trong két','Total in drawer')} <em>${cashTot(S.cash)}k</em></span>`;
 const mid=cs?`<div class="cpm"><div class="cpbox cust"><h5>${U('cash')} ${t('Khách đưa','Customer paid')}</h5><div class="notes">${DEN.slice().reverse().filter(v=>cs.paid.includes(v)).map(v=>`<div class="nt">${noteArt(v)}${cs.paid.filter(x=>x==v).length>1?`<b>×${cs.paid.filter(x=>x==v).length}</b>`:''}</div>`).join('')}</div></div>
  <div class="cpbox tray"><h5>${U('bag')} ${t('Khay thối tiền','Change tray')}</h5><span class="led">${t('Đã chọn','Picked')} ${trT}k</span>
   <div class="notes">${trT?DEN.slice().reverse().filter(v=>tray[v]).map(v=>`<div class="nt tn" data-a="cout" data-v="${v}">${noteArt(v)}<b>×${tray[v]}</b></div>`).join(''):`<span class="cpnote">${t('Chạm tờ tiền trong két bên dưới để đưa vào khay · chạm tờ trong khay để bỏ ra','Tap a note in the drawer below to add it · tap a note here to remove it')}</span>`}</div>
   <div class="cpa"><button class="g big" data-a="cok">✔ ${t('Trả tiền thối','Give change')}</button><button class="rd" data-a="cclr">${t('Làm lại','Clear')}</button></div></div></div>`
  :`<div class="cpm" style="height:44px"><span class="cpnote">${t('Chưa có khách trả tiền mặt. Khi khách trả tiền mặt, két sẽ tự mở để bạn thối tiền.','No cash payment now. The drawer opens when a customer pays in cash.')}</span></div>`;
 return `<div class="cph"><b>${U('cash')} ${t('KÉT TIỀN','CASH DRAWER')}</b>${head}<span style="flex:1"></span>${cs?'':`<button class="rd sm" data-a="cclose">✖</button>`}</div>${mid}
 <div class="cpd">${DEN.map(v=>{const left=(S.cash[v]||0)-(tray[v]||0);return `<div class="cmp${left<=0?' zero':''}${cs?'':' ro'}"${cs?` data-a="cin" data-v="${v}"`:''}><div class="nt">${noteArt(v)}<b>×${left}</b></div></div>`}).join('')}</div>`}
function cashUI(c){
 const cs=c&&c.cs,show=S.view==0&&(cs||S.cashView),p=$('cp');
 if(show){if(p.style.display!='block'){p.style.display='block';p.__h=null}set('cp',cashHTML())}else if(p.style.display!='none')p.style.display='none';
 $('cdw').classList.toggle('act',!!cs);p.classList.toggle('pk',!cs);
 set('cdw',`<i class="slot">${noteArt(100,'n')}${noteArt(50,'n')}${noteArt(20,'n')}</i><div class="lb"><b>${cs?t('ĐANG THỐI TIỀN','GIVE CHANGE'):t('KÉT TIỀN','CASH DRAWER')}</b><span>${cashTot(S.cash)}k</span></div>`)}

function fill(i){const d=S.pr[i];let room=cap(i)-cnt(d.s);while(room>0&&d.w.length){const b=d.w[0],q=Math.min(room,b.q);addB(d.s,q,b.e);b.q-=q;room-=q;if(!b.q)d.w.shift()}}

/* ================= HÀNH ĐỘNG NÚT BẤM ================= */
function act(a,v){
 const c=S&&S.cur;
 if(a=='lang'){lang=lang=='vi'?'en':'vi';ls.s('mlang',lang);document.querySelectorAll('#st *').forEach(e=>e.__h=null);hud();decor();if(mode=='menu')menu();if(S)pn()}
 else if(a=='snd'){snd=!snd;ls.s('msnd',snd?'1':'0');hud();if(mode=='menu')menu();sfx('pop')}
 else if(a=='new'){S=base();runtime();ls.s('mart','');save();resetView();hud();mode='menu';tutorial()}
 else if(a=='cont'){try{S=Object.assign(base(),JSON.parse(ls.g('mart')));S.st=Object.assign(blank(),S.st);S.cash=Object.assign({...FLOAT},S.cash)}catch(e){S=base()}runtime();resetView();hud();ov('');mode='play'}
 else if(a=='go'){ov('');mode='play'}
 else if(a=='next')nextDay();
 else if(mode!='play'&&a!='tab'&&a!='close')return;
 else if(a=='view')goV(+v);
 else if(a=='nav')goV(NAV[Math.max(0,Math.min(2,NAV.indexOf(S.view)+ +v))]);
 else if(a=='cin'){const cs=c&&c.cs;if(!cs||S.off)return;v=+v;if((S.cash[v]||0)-(cs.tray[v]||0)<=0)return bad(t('Hết tờ này trong két!','No more of this note!'));cs.tray[v]=(cs.tray[v]||0)+1;sfx('pop')}
 else if(a=='cout'){const cs=c&&c.cs;if(!cs)return;v=+v;if(cs.tray[v]){cs.tray[v]--;if(!cs.tray[v])delete cs.tray[v];sfx('pop')}}
 else if(a=='cclr'){if(c&&c.cs){c.cs.tray={};sfx('pop')}}
 else if(a=='cok')cashOk();
 else if(a=='cashv'){if(!(c&&c.cs)){S.cashView=!S.cashView;sfx('pop')}}
 else if(a=='cclose'){S.cashView=false;sfx('pop')}
 else if(a=='take')take(+v);
 else if(a=='put')put(+v);
 else if(a=='bag'){if(!c)return;v=+v;if(its(c,x=>x.loc=='bag').length>[3,5,10][v])return bad(t('Túi quá nhỏ!','Bag too small!'));c.bag=v;sfx('pop')}
 else if(a=='pay')pay(+v);
 else if(a=='dc'&&c){c.disc=+v;if(v==2)S.r=cl(S.r+.5);else c.pat-=c.max*.15;sfx('pop')}
 else if(a=='open'){panelOpen=true;tab=+v;pn();sfx('pop')}
 else if(a=='close'){panelOpen=false;pn()}
 else if(a=='tab'){tab=+v;pn();sfx('pop')}
 else if(a=='fill'){fill(+v);pn();sfx('fill')}
 else if(a=='filla'){for(let i=0;i<NP;i++)fill(i);pn();sfx('fill')}
 else if(a=='trash'){const d=S.pr[+v];let l=0;for(const k of['s','w']){l+=d[k].filter(x=>S.d>x.e).reduce((a,x)=>a+x.q*P[+v][3],0);d[k]=d[k].filter(x=>S.d<=x.e)}S.st.loss+=l;pn();sfx('pop');toast(t('Đã vứt hàng hết hạn','Expired stock removed'))}
 else if(a=='buy'){const i=+v,cost=6*P[i][3];if(S.m<cost)return bad(t('Không đủ tiền!','Not enough money!'));
  if(whTot()+6>whCap())return bad(t('Kho đã đầy – hãy fill hàng ra kệ hoặc nâng cấp','Warehouse full'));S.m-=cost;addB(S.pr[i].w,6,S.d+P[i][5]);pn();sfx('buy')}
 else if(a=='up'){const u=UP.find(x=>x[0]==v),lv=S.u[v],cost=u[3]*(lv+1);if(S.m<cost)return bad(t('Không đủ tiền!','Not enough money!'));S.m-=cost;S.u[v]++;pn();save();sfx('up')}
 else if(a=='rpt'){S.rd=1;S.m+=25;S.r=cl(S.r+1);pn();sfx('cash');toast(t('Đã nộp báo cáo +25k','Report sent +25k'),'good')}
 else if(a=='thr'){const b=Math.round(S.th*.5);S.m+=b;S.st.loss-=b;S.th=0;pn();sfx('cash');toast('+'+b+'k')}
 else if(a=='fix'&&S.fr&&!S.fr.fix){S.m-=60;S.st.rp+=60;S.fr.fix=15;sfx('buy')}
 else if(a=='brk'){S.taps++;sfx('pop');if(S.taps>=6){S.off=0;sfx('up');toast('💡 OK','good')}}
 if(S&&mode=='play')R()}

/* ================= KHỞI TẠO & SỰ KIỆN CHUỘT/CHẠM ================= */
function fit(){
 const w=$('wrap').clientWidth,h=$('wrap').clientHeight,port=h>w*1.1,e=$('st');
 document.body.classList.toggle('port',port);
 SC=port?Math.min(h/960,w/540):Math.min(w/960,h/540);
 // Màn hình dọc: xoay cảnh 90° để game lấp đầy màn hình (người chơi xoay ngang điện thoại là thẳng lại)
 e.style.transform=port?`translate(${(w+540*SC)/2}px,${(h-960*SC)/2}px) rotate(90deg) scale(${SC})`:`translate(${(w-960*SC)/2}px,${(h-540*SC)/2}px) scale(${SC})`}
// Làm sáng các ô có thể thả khi đang kéo một món
function hint(k){
 document.querySelectorAll('.tgt').forEach(e=>e.classList.remove('tgt'));
 if(!k||!S)return;
 const z=[];
 if(k[0]=='W')z.push('cart');
 else if(k[0]=='K')z.push('sh:'+k.slice(2));
 else if(S.cur&&!S.view){
  if(k=='cup')z.push('mac');
  else{const it=S.cur.items.find(x=>x.u==k);
   if(it){if(it.loc=='tray'&&!it.sc)z.push('scan');else if(it.loc=='tray'&&it.sc&&it.h)z.push(it.h);else if(it.loc!='bag'&&it.sc&&(!it.h||it.done)&&!it.t0)z.push('bag')}}}
 z.forEach(id=>document.querySelectorAll(`[data-z="${id}"]`).forEach(e=>e.classList.add('tgt')))}
$('st').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)});
$('st').addEventListener('pointerdown',e=>{const d=e.target.closest('[data-k]');if(!d||mode!='play')return;e.preventDefault();
 const sv=d.querySelector('svg.ic')||d.querySelector('svg');if(!sv)return;
 dr=d.dataset.k;const g=document.createElement('div');g.id='gh';g.innerHTML=d.dataset.k[0]=='W'?ic(+d.dataset.k.slice(2)):sv.outerHTML;g.style.width=g.style.height=Math.round(48*SC)+'px';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
 if(document.body.classList.contains('port'))g.style.transform='translate(-50%,-60%) rotate(82deg)';
 document.body.appendChild(g);hint(dr)});
addEventListener('pointermove',e=>{const g=$('gh');if(g){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}});
const endDrag=e=>{const g=$('gh');if(!g)return;g.remove();hint(null);const k=dr;dr=null;
 if(e.type=='pointercancel')return;
 const z=document.elementFromPoint(e.clientX,e.clientY),zn=z&&z.closest('[data-z]');if(zn&&S&&mode=='play'){hand(k,zn.dataset.z);R()}};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
$('trb').innerHTML=G1.BASKET_BACK;$('trf').innerHTML=G1.BASKET_FRONT;
addEventListener('resize',fit);decor();fit();hud();layers();menu();setInterval(tick,100);
addEventListener('keydown',e=>{if(!S||mode!='play')return;if(e.key=='ArrowUp'){e.preventDefault();act('nav',-1)}else if(e.key=='ArrowDown'){e.preventDefault();act('nav',1)}});
if(innerHeight>innerWidth*1.1&&!ls.g('mrot')){ls.s('mrot','1');setTimeout(()=>toast(t('Mẹo: xoay ngang điện thoại để chơi thoải mái hơn','Tip: rotate your phone sideways for more room')),600)}

</script></body></html>
